spring.application.name=grade-tracker-backend

server.port=8080

# Database (MySQL)
spring.datasource.url=jdbc:mysql://localhost:3306/student_tracker_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ML service
ml.api.url=http://localhost:8000